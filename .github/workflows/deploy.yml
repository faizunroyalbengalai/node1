name: Deploy Node on Amazon EKS

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: nodeeks9
  APP_NAME: node
  NODE_VERSION: "20"
  ECR_REPOSITORY: nodeeks9-node
  EKS_CLUSTER_NAME: nodeeks9-eks
  NAMESPACE: nodeeks9

jobs:
  provision:
    name: Provision EKS Infrastructure
    runs-on: ubuntu-latest
    outputs:
      ecr_registry: ${{ steps.ecr.outputs.registry }}
      cluster_name: ${{ steps.eks.outputs.cluster_name }}
      alb_hostname: ${{ steps.alb.outputs.hostname }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false

      - name: Create Terraform configuration
        run: |
          mkdir -p infra
          cat > infra/main.tf << 'TFEOF'
          terraform {
            required_version = ">= 1.7.0"
            required_providers {
              aws = {
                source  = "hashicorp/aws"
                version = "~> 5.0"
              }
              kubernetes = {
                source  = "hashicorp/kubernetes"
                version = "~> 2.0"
              }
              helm = {
                source  = "hashicorp/helm"
                version = "~> 2.0"
              }
            }
            backend "s3" {
              bucket = "nodeeks9-tfstate"
              key    = "nodeeks9/eks/terraform.tfstate"
              region = "us-east-1"
            }
          }

          provider "aws" {
            region = var.aws_region
          }

          variable "aws_region" {
            default = "us-east-1"
          }

          variable "project_name" {
            default = "nodeeks9"
          }

          variable "app_name" {
            default = "node"
          }

          data "aws_availability_zones" "available" {
            state = "available"
          }

          # VPC
          resource "aws_vpc" "main" {
            cidr_block           = "10.0.0.0/16"
            enable_dns_hostnames = true
            enable_dns_support   = true

            tags = {
              Name                                                = "${var.project_name}-vpc"
              "kubernetes.io/cluster/${var.project_name}-eks"    = "shared"
            }
          }

          resource "aws_internet_gateway" "main" {
            vpc_id = aws_vpc.main.id

            tags = {
              Name = "${var.project_name}-igw"
            }
          }

          resource "aws_subnet" "public" {
            count                   = 2
            vpc_id                  = aws_vpc.main.id
            cidr_block              = "10.0.${count.index}.0/24"
            availability_zone       = data.aws_availability_zones.available.names[count.index]
            map_public_ip_on_launch = true

            tags = {
              Name                                                = "${var.project_name}-public-${count.index}"
              "kubernetes.io/cluster/${var.project_name}-eks"    = "shared"
              "kubernetes.io/role/elb"                           = "1"
            }
          }

          resource "aws_subnet" "private" {
            count             = 2
            vpc_id            = aws_vpc.main.id
            cidr_block        = "10.0.${count.index + 10}.0/24"
            availability_zone = data.aws_availability_zones.available.names[count.index]

            tags = {
              Name                                                = "${var.project_name}-private-${count.index}"
              "kubernetes.io/cluster/${var.project_name}-eks"    = "shared"
              "kubernetes.io/role/internal-elb"                  = "1"
            }
          }

          resource "aws_eip" "nat" {
            count  = 2
            domain = "vpc"

            tags = {
              Name = "${var.project_name}-nat-eip-${count.index}"
            }
          }

          resource "aws_nat_gateway" "main" {
            count         = 2
            allocation_id = aws_eip.nat[count.index].id
            subnet_id     = aws_subnet.public[count.index].id

            tags = {
              Name = "${var.project_name}-nat-${count.index}"
            }

            depends_on = [aws_internet_gateway.main]
          }

          resource "aws_route_table" "public" {
            vpc_id = aws_vpc.main.id

            route {
              cidr_block = "0.0.0.0/0"
              gateway_id = aws_internet_gateway.main.id
            }

            tags = {
              Name = "${var.project_name}-public-rt"
            }
          }

          resource "aws_route_table_association" "public" {
            count          = 2
            subnet_id      = aws_subnet.public[count.index].id
            route_table_id = aws_route_table.public.id
          }

          resource "aws_route_table" "private" {
            count  = 2
            vpc_id = aws_vpc.main.id

            route {
              cidr_block     = "0.0.0.0/0"
              nat_gateway_id = aws_nat_gateway.main[count.index].id
            }

            tags = {
              Name = "${var.project_name}-private-rt-${count.index}"
            }
          }

          resource "aws_route_table_association" "private" {
            count          = 2
            subnet_id      = aws_subnet.private[count.index].id
            route_table_id = aws_route_table.private[count.index].id
          }

          # Security Groups
          resource "aws_security_group" "eks_cluster" {
            name        = "${var.project_name}-eks-cluster-sg"
            description = "EKS cluster security group"
            vpc_id      = aws_vpc.main.id

            egress {
              from_port   = 0
              to_port     = 0
              protocol    = "-1"
              cidr_blocks = ["0.0.0.0/0"]
            }

            tags = {
              Name = "${var.project_name}-eks-cluster-sg"
            }
          }

          resource "aws_security_group" "eks_nodes" {
            name        = "${var.project_name}-eks-nodes-sg"
            description = "EKS node group security group"
            vpc_id      = aws_vpc.main.id

            ingress {
              from_port = 0
              to_port   = 0
              protocol  = "-1"
              self      = true
            }

            ingress {
              from_port       = 0
              to_port         = 0
              protocol        = "-1"
              security_groups = [aws_security_group.eks_cluster.id]
            }

            ingress {
              from_port   = 80
              to_port     = 80
              protocol    = "tcp"
              cidr_blocks = ["0.0.0.0/0"]
            }

            ingress {
              from_port   = 443
              to_port     = 443
              protocol    = "tcp"
              cidr_blocks = ["0.0.0.0/0"]
            }

            egress {
              from_port   = 0
              to_port     = 0
              protocol    = "-1"
              cidr_blocks = ["0.0.0.0/0"]
            }

            tags = {
              Name = "${var.project_name}-eks-nodes-sg"
            }
          }

          # IAM Roles
          resource "aws_iam_role" "eks_cluster" {
            name = "${var.project_name}-eks-cluster-role"

            assume_role_policy = jsonencode({
              Version = "2012-10-17"
              Statement = [{
                Action = "sts:AssumeRole"
                Effect = "Allow"
                Principal = {
                  Service = "eks.amazonaws.com"
                }
              }]
            })
          }

          resource "aws_iam_role_policy_attachment" "eks_cluster_policy" {
            policy_arn = "arn:aws:iam::aws:policy/AmazonEKSClusterPolicy"
            role       = aws_iam_role.eks_cluster.name
          }

          resource "aws_iam_role" "eks_nodes" {
            name = "${var.project_name}-eks-nodes-role"

            assume_role_policy = jsonencode({
              Version = "2012-10-17"
              Statement = [{
                Action = "sts:AssumeRole"
                Effect = "Allow"
                Principal = {
                  Service = "ec2.amazonaws.com"
                }
              }]
            })
          }

          resource "aws_iam_role_policy_attachment" "eks_worker_node_policy" {
            policy_arn = "arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy"
            role       = aws_iam_role.eks_nodes.name
          }

          resource "aws_iam_role_policy_attachment" "eks_cni_policy" {
            policy_arn = "arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy"
            role       = aws_iam_role.eks_nodes.name
          }

          resource "aws_iam_role_policy_attachment" "eks_ecr_read_only" {
            policy_arn = "arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly"
            role       = aws_iam_role.eks_nodes.name
          }

          # ECR Repository
          resource "aws_ecr_repository" "app" {
            name                 = "${var.project_name}-${var.app_name}"
            image_tag_mutability = "MUTABLE"
            force_delete         = true

            image_scanning_configuration {
              scan_on_push = true
            }

            tags = {
              Name    = "${var.project_name}-${var.app_name}"
              Project = var.project_name
            }
          }

          resource "aws_ecr_lifecycle_policy" "app" {
            repository = aws_ecr_repository.app.name

            policy = jsonencode({
              rules = [{
                rulePriority = 1
                description  = "Keep last 10 images"
                selection = {
                  tagStatus   = "any"
                  countType   = "imageCountMoreThan"
                  countNumber = 10
                }
                action = {
                  type = "expire"
                }
              }]
            })
          }

          # EKS Cluster
          resource "aws_eks_cluster" "main" {
            name     = "${var.project_name}-eks"
            role_arn = aws_iam_role.eks_cluster.arn
            version  = "1.29"

            vpc_config {
              subnet_ids              = concat(aws_subnet.public[*].id, aws_subnet.private[*].id)
              security_group_ids      = [aws_security_group.eks_cluster.id]
              endpoint_private_access = true
              endpoint_public_access  = true
            }

            depends_on = [
              aws_iam_role_policy_attachment.eks_cluster_policy,
            ]

            tags = {
              Name    = "${var.project_name}-eks"
              Project = var.project_name
            }
          }

          # EKS Node Group
          resource "aws_eks_node_group" "main" {
            cluster_name    = aws_eks_cluster.main.name
            node_group_name = "${var.project_name}-node-group"
            node_role_arn   = aws_iam_role.eks_nodes.arn
            subnet_ids      = aws_subnet.private[*].id
            instance_types  = ["t3.medium"]

            scaling_config {
              desired_size = 2
              max_size     = 4
              min_size     = 1
            }

            update_config {
              max_unavailable = 1
            }

            remote_access {
              ec2_ssh_key               = aws_key_pair.eks_nodes.key_name
              source_security_group_ids = [aws_security_group.eks_nodes.id]
            }

            depends_on = [
              aws_iam_role_policy_attachment.eks_worker_node_policy,
              aws_iam_role_policy_attachment.eks_cni_policy,
              aws_iam_role_policy_attachment.eks_ecr_read_only,
            ]

            tags = {
              Name    = "${var.project_name}-node-group"
              Project = var.project_name
            }
          }

          resource "aws_key_pair" "eks_nodes" {
            key_name   = "${var.project_name}-eks-nodes-key"
            public_key = var.public_key
          }

          variable "public_key" {
            description = "SSH public key for EKS node access"
            default     = ""
          }

          # OIDC Provider for ALB Ingress Controller IAM
          data "tls_certificate" "eks" {
            url = aws_eks_cluster.main.identity[0].oidc[0].issuer
          }

          resource "aws_iam_openid_connect_provider" "eks" {
            client_id_list  = ["sts.amazonaws.com"]
            thumbprint_list = [data.tls_certificate.eks.certificates[0].sha1_fingerprint]
            url             = aws_eks_cluster.main.identity[0].oidc[0].issuer
          }

          # IAM Role for ALB Ingress Controller
          resource "aws_iam_role" "alb_ingress" {
            name = "${var.project_name}-alb-ingress-role"

            assume_role_policy = jsonencode({
              Version = "2012-10-17"
              Statement = [{
                Effect = "Allow"
                Principal = {
                  Federated = aws_iam_openid_connect_provider.eks.arn
                }
                Action = "sts:AssumeRoleWithWebIdentity"
                Condition = {
                  StringEquals = {
                    "${replace(aws_iam_openid_connect_provider.eks.url, "https://", "")}:sub" = "system:serviceaccount:kube-system:aws-load-balancer-controller"
                    "${replace(aws_iam_openid_connect_provider.eks.url, "https://", "")}:aud" = "sts.amazonaws.com"
                  }
                }
              }]
            })
          }

          resource "aws_iam_policy" "alb_ingress" {
            name = "${var.project_name}-alb-ingress-policy"

            policy = jsonencode({
              Version = "2012-10-17"
              Statement = [
                {
                  Effect   = "Allow"
                  Action   = ["iam:CreateServiceLinkedRole"]
                  Resource = "*"
                  Condition = {
                    StringEquals = {
                      "iam:AWSServiceName" = "elasticloadbalancing.amazonaws.com"
                    }
                  }
                },
                {
                  Effect = "Allow"
                  Action = [
                    "ec2:DescribeAccountAttributes",
                    "ec2:DescribeAddresses",
                    "ec2:DescribeAvailabilityZones",
                    "ec2:DescribeInternetGateways",
                    "ec2:DescribeVpcs",
                    "ec2:DescribeVpcPeeringConnections",
                    "ec2:DescribeSubnets",
                    "ec2:DescribeSecurityGroups",
                    "ec2:DescribeInstances",
                    "ec2:DescribeNetworkInterfaces",
                    "ec2:DescribeTags",
                    "ec2:GetCoipPoolUsage",
                    "ec2:DescribeCoipPools",
                    "elasticloadbalancing:DescribeLoadBalancers",
                    "elasticloadbalancing:DescribeLoadBalancerAttributes",
                    "elasticloadbalancing:DescribeListeners",
                    "elasticloadbalancing:DescribeListenerCertificates",
                    "elasticloadbalancing:DescribeSSLPolicies",
                    "elasticloadbalancing:DescribeRules",
                    "elasticloadbalancing:DescribeTargetGroups",
                    "elasticloadbalancing:DescribeTargetGroupAttributes",
                    "elasticloadbalancing:DescribeTargetHealth",
                    "elasticloadbalancing:DescribeTags"
                  ]
                  Resource = "*"
                },
                {
                  Effect = "Allow"
                  Action = [
                    "cognito-idp:DescribeUserPoolClient",
                    "acm:ListCertificates",
                    "acm:DescribeCertificate",
                    "iam:ListServerCertificates",
                    "iam:GetServerCertificate",
                    "waf-regional:GetWebACL",
                    "waf-regional:GetWebACLForResource",
                    "waf-regional:AssociateWebACL",
                    "waf-regional:DisassociateWebACL",
                    "wafv2:GetWebACL",
                    "wafv2:GetWebACLForResource",
                    "wafv2:AssociateWebACL",
                    "wafv2:DisassociateWebACL",
                    "shield:GetSubscriptionState",
                    "shield:DescribeProtection",
                    "shield:CreateProtection",
                    "shield:DeleteProtection"
                  ]
                  Resource = "*"
                },
                {
                  Effect = "Allow"
                  Action = [
                    "ec2:AuthorizeSecurityGroupIngress",
                    "ec2:RevokeSecurityGroupIngress"
                  ]
                  Resource = "*"
                },
                {
                  Effect   = "Allow"
                  Action   = ["ec2:CreateSecurityGroup"]
                  Resource = "*"
                },
                {
                  Effect   = "Allow"
                  Action   = ["ec2:CreateTags"]
                  Resource = "arn:aws:ec2:*:*:security-group/*"
                  Condition = {
                    StringEquals = {
                      "ec2:CreateAction" = "CreateSecurityGroup"
                    }
                    Null = {
                      "aws:RequestedRegion" = "false"
                    }
                  }
                },
                {
                  Effect   = "Allow"
                  Action   = ["ec2:CreateTags", "ec2:DeleteTags"]
                  Resource = "arn:aws:ec2:*:*:security-group/*"
                  Condition = {
                    Null = {
                      "aws:RequestTag/elbv2.k8s.aws/cluster"    = "false"
                      "aws:ResourceTag/elbv2.k8s.aws/cluster"   = "false"
                    }
                  }
                },
                {
                  Effect = "Allow"
                  Action = [
                    "ec2:AuthorizeSecurityGroupIngress",
                    "ec2:RevokeSecurityGroupIngress",
                    "ec2:DeleteSecurityGroup"
                  ]
                  Resource = "*"
                  Condition = {
                    Null = {
                      "aws:ResourceTag/elbv2.k8s.aws/cluster" = "false"
                    }
                  }
                },
                {
                  Effect = "Allow"
                  Action = [
                    "elasticloadbalancing:CreateLoadBalancer",
                    "elasticloadbalancing:CreateTargetGroup"
                  ]
                  Resource = "*"
                  Condition = {
                    Null = {
                      "aws:RequestTag/elbv2.k8s.aws/cluster" = "false"
                    }
                  }
                },
                {
                  Effect = "Allow"
                  Action = [
                    "elasticloadbalancing:CreateListener",
                    "elasticloadbalancing:DeleteListener",
                    "elasticloadbalancing:CreateRule",
                    "elasticloadbalancing:DeleteRule"
                  ]
                  Resource = "*"
                },
                {
                  Effect = "Allow"
                  Action = [
                    "elasticloadbalancing:AddTags",
                    "elasticloadbalancing:RemoveTags"
                  ]
                  Resource = [
                    "arn:aws:elasticloadbalancing:*:*:targetgroup/*/*",
                    "arn:aws:elasticloadbalancing:*:*:loadbalancer/net/*/*",
                    "arn:aws:elasticloadbalancing:*:*:loadbalancer/app/*/*"
                  ]
                  Condition = {
                    Null = {
                      "aws:RequestTag/elbv2.k8s.aws/cluster"  = "true"
                      "aws:ResourceTag/elbv2.k8s.aws/cluster" = "false"
                    }
                  }
                },
                {
                  Effect = "Allow"
                  Action = [
                    "elasticloadbalancing:AddTags",
                    "elasticloadbalancing:RemoveTags"
                  ]
                  Resource = [
                    "arn:aws:elasticloadbalancing:*:*:listener/net/*/*/*",
                    "arn:aws:elasticloadbalancing:*:*:listener/app/*/*/*",
                    "arn:aws:elasticloadbalancing:*:*:listener-rule/net/*/*/*",
                    "arn:aws:elasticloadbalancing:*:*:listener-rule/app/*/*/*"
                  ]
                },
                {
                  Effect = "Allow"
                  Action = [
                    "elasticloadbalancing:ModifyLoadBalancerAttributes",
                    "elasticloadbalancing:SetIpAddressType",
                    "elasticloadbalancing:SetSecurityGroups",
                    "elasticloadbalancing:SetSubnets",
                    "elasticloadbalancing:DeleteLoadBalancer",
                    "elasticloadbalancing:ModifyTargetGroup",
                    "elasticloadbalancing:ModifyTargetGroupAttributes",
                    "elasticloadbalancing:DeleteTargetGroup"
                  ]
                  Resource = "*"
                  Condition = {
                    Null = {
                      "aws:ResourceTag/elbv2.k8s.aws/cluster" = "false"
                    }
                  }
                },
                {
                  Effect = "Allow"
                  Action = [
                    "elasticloadbalancing:AddTags"
                  ]
                  Resource = [
                    "arn:aws:elasticloadbalancing:*:*:targetgroup/*/*",
                    "arn:aws:elasticloadbalancing:*:*:loadbalancer/net/*/*",
                    "arn:aws:elasticloadbalancing:*:*:loadbalancer/app/*/*"
                  ]
                  Condition = {
                    StringEquals = {
                      "elasticloadbalancing:CreateAction" = ["CreateTargetGroup", "CreateLoadBalancer"]
                    }
                    Null = {
                      "aws:RequestTag/elbv2.k8s.aws/cluster" = "false"
                    }
                  }
                },
                {
                  Effect = "Allow"
                  Action = [
                    "elasticloadbalancing:RegisterTargets",
                    "elasticloadbalancing:DeregisterTargets"
                  ]
                  Resource = "arn:aws:elasticloadbalancing:*:*:targetgroup/*/*"
                },
                {
                  Effect = "Allow"
                  Action = [
                    "elasticloadbalancing:SetWebAcl",
                    "elasticloadbalancing:ModifyListener",
                    "elasticloadbalancing:AddListenerCertificates",
                    "elasticloadbalancing:RemoveListenerCertificates",
                    "elasticloadbalancing:ModifyRule"
                  ]
                  Resource = "*"
                }
              ]
            })
          }

          resource "aws_iam_role_policy_attachment" "alb_ingress" {
            policy_arn = aws_iam_policy.alb_ingress.arn
            role       = aws_iam_role.alb_ingress.name
          }

          # RDS PostgreSQL
          resource "aws_db_subnet_group" "main" {
            name       = "${var.project_name}-db-subnet-group"
            subnet_ids = aws_subnet.private[*].id

            tags = {
              Name = "${var.project_name}-db-subnet-group"
            }
          }

          resource "aws_security_group" "rds" {
            name        = "${var.project_name}-rds-sg"
            description = "RDS security group"
            vpc_id      = aws_vpc.main.id

            ingress {
              from_port       = 5432
              to_port         = 5432
              protocol        = "tcp"
              security_groups = [aws_security_group.eks_nodes.id]
            }

            egress {
              from_port   = 0
              to_port     = 0
              protocol    = "-1"
              cidr_blocks = ["0.0.0.0/0"]
            }

            tags = {
              Name = "${var.project_name}-rds-sg"
            }
          }

          resource "aws_db_instance" "main" {
            identifier             = "${var.project_name}-postgres"
            engine                 = "postgres"
            engine_version         = "15.4"
            instance_class         = "db.t3.micro"
            allocated_storage      = 20
            storage_encrypted      = true
            db_name                = "appdb"
            username               = var.db_username
            password               = var.db_password
            db_subnet_group_name   = aws_db_subnet_group.main.name
            vpc_security_group_ids = [aws_security_group.rds.id]
            skip_final_snapshot    = true
            deletion_protection    = false
            publicly_accessible    = false
            multi_az               = false

            tags = {
              Name    = "${var.project_name}-postgres"
              Project = var.project_name
            }
          }

          variable "db_username" {
            description = "Database username"
            default     = "appuser"
          }

          variable "db_password" {
            description = "Database password"
            sensitive   = true
          }

          # Outputs
          output "ecr_repository_url" {
            value = aws_ecr_repository.app.repository_url
          }

          output "eks_cluster_name" {
            value = aws_eks_cluster.main.name
          }

          output "eks_cluster_endpoint" {
            value = aws_eks_cluster.main.endpoint
          }

          output "alb_ingress_role_arn" {
            value = aws_iam_role.alb_ingress.arn
          }

          output "db_endpoint" {
            value = aws_db_instance.main.endpoint
          }

          output "db_name" {
            value = aws_db_instance.main.db_name
          }

          output "vpc_id" {
            value = aws_vpc.main.id
          }
          TFEOF

      - name: Setup Terraform TLS provider
        run: |
          cat >> infra/main.tf << 'TLSEOF'

          terraform {
            required_providers {
              tls = {
                source  = "hashicorp/tls"
                version = "~> 4.0"
              }
            }
          }
          TLSEOF

      - name: Ensure S3 backend bucket exists
        run: |
          if ! aws s3api head-bucket --bucket "nodeeks9-tfstate" 2>/dev/null; then
            aws s3api create-bucket \
              --bucket "nodeeks9-tfstate" \
              --region us-east-1
            aws s3api put-bucket-versioning \
              --bucket "nodeeks9-tfstate" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption \
              --bucket "nodeeks9-tfstate" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          fi

      - name: Terraform Init
        working-directory: infra
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=nodeeks9-tfstate" \
            -backend-config="key=nodeeks9/eks/terraform.tfstate" \
            -backend-config="region=us-east-1"

      - name: Terraform Apply
        working-directory: infra
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_public_key: ${{ secrets.EC2_PUBLIC_KEY }}
        run: |
          terraform apply -auto-approve \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="db_username=${{ secrets.DB_USERNAME }}"

      - name: Get Terraform outputs
        id: ecr
        working-directory: infra
        run: |
          ECR_URL=$(terraform output -raw ecr_repository_url)
          ECR_REGISTRY=$(echo "$ECR_URL" | cut -d'/' -f1)
          echo "registry=$ECR_REGISTRY" >> $GITHUB_OUTPUT
          echo "ecr_url=$ECR_URL" >> $GITHUB_OUTPUT

      - name: Get EKS cluster name
        id: eks
        working-directory: infra
        run: |
          CLUSTER=$(terraform output -raw eks_cluster_name)
          echo "cluster_name=$CLUSTER" >> $GITHUB_OUTPUT

      - name: Get ALB hostname placeholder
        id: alb
        run: |
          echo "hostname=pending" >> $GITHUB_OUTPUT

  configure:
    name: Build, Push, and Deploy to EKS
    runs-on: ubuntu-latest
    needs: provision

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false

      - name: Restore Terraform configuration
        run: |
          mkdir -p infra
          cat > infra/main.tf << 'TFEOF'